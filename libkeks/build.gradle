
plugins {
    id 'com.android.library'
}
repositories {
    google()
    mavenCentral()
}

android {
    compileSdkVersion 36

    defaultConfig {
        minSdkVersion 28
        targetSdkVersion 35

        testInstrumentationRunner "androidx.test.runner.AndroidJUnitRunner"
        consumerProguardFiles "consumer-rules.pro"
    }

    buildTypes {
        release {
            minifyEnabled true
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
        }

    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
    namespace 'jamorham.libkeks'
}


dependencies {
    compileOnly files('lib/xdrip-plugin-interface.jar')
    implementation 'androidx.legacy:legacy-support-v13:1.0.0'

    implementation 'org.bouncycastle:bcpkix-jdk15to18:1.83'
    implementation 'org.bouncycastle:bcprov-jdk15to18:1.83'

    testImplementation files('lib/xdrip-plugin-interface.jar')
    testImplementation 'junit:junit:4.13.2'

    testImplementation 'org.powermock:powermock-api-mockito2:2.0.9'
    testImplementation 'org.powermock:powermock-module-junit4:2.0.9'
    testImplementation "org.mockito:mockito-core:5.21.0"
    // don't update as mismatches with powermock

    testImplementation "com.google.truth:truth:1.4.5"

}
